name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Do not include personal data, location coordinates, or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
    validations:
      required: true
